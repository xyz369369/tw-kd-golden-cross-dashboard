name: 台股 KD 黃金交叉每日更新

on:
  schedule:
    # 06:45 UTC = 14:45 Taipei time, Mon-Fri (after TWSE 13:30 close)
    - cron: "45 6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet requests pandas

      - name: Run daily update
        working-directory: scripts
        run: python daily_update.py

      - name: Commit and push updated data
        run: |
          git config user.name "tw-kd-bot"
          git config user.email "tw-kd-bot@users.noreply.github.com"
          git add data/tw_stocks.db docs/data.json docs/history.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: daily data update $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Notify via GitHub Issue if new matches found
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
import json, os, subprocess

with open("docs/data.json", encoding="utf-8") as f:
    data = json.load(f)

new_codes = data.get("new_matches_today", [])
if not new_codes:
    print("No new matches today, skipping notification.")
    raise SystemExit(0)

new_matches = [m for m in data["matches"] if m["code"] in new_codes]
lines = [f"資料日期：{data['data_date']}", "", "新增符合條件標的：", ""]
for m in new_matches:
    lines.append(
        f"- {m['code']} {m['name']}（{m['market']}）收盤 {m['close']} / MA20 {m['ma20_close']} "
        f"K={m['K']} D={m['D']}"
    )
body = "\n".join(lines)
title = f"台股KD黃金交叉：新增{len(new_matches)}筆符合條件（{data['data_date']}）"

subprocess.run(
    ["gh", "issue", "create", "--title", title, "--body", body],
    check=True,
)
PY

