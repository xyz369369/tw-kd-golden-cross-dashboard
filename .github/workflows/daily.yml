name: 台股 KD 黃金交叉每日更新

on:
  schedule:
    # 06:45 UTC = 14:45 Taipei time, Mon-Fri (after TWSE 13:30 close)
    - cron: "45 6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet requests pandas

      - name: Run daily update
        working-directory: scripts
        run: python daily_update.py

      - name: Commit and push updated data
        run: |
          git config user.name "tw-kd-bot"
          git config user.email "tw-kd-bot@users.noreply.github.com"
          git add data/tw_stocks.db docs/data.json docs/history.json docs/stocks_history.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: daily data update $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Notify via GitHub Issue if new matches found
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: scripts
        run: python3 notify_new_matches.py
